# Values for grafana/loki-stack (chart 2.10.3), applied via the "loki"
# ArgoCD Application (terraform/argocd-monitoring-apps.tf). This is the
# simpler, filesystem-backed "quick-start" Loki bundle — appropriate for a
# single small coursework cluster (no S3/GCS object storage to set up,
# unlike the production-grade distributed "loki" chart).
#
# grafana.enabled stays false here (chart default) — we already have one
# Grafana from kube-prometheus-stack. This chart auto-registers Loki as a
# datasource with ANY Grafana in the cluster via a ConfigMap labeled
# "grafana_datasource: 1" (sidecar-discovered), regardless of grafana.enabled
# — so no manual datasource entry is needed on the Grafana side.
#
# isDefault must be overridden to false: this chart's own default is true,
# which collides with kube-prometheus-stack's own Prometheus datasource
# (also isDefault: true) — Grafana refuses to start with two defaults.
loki:
  isDefault: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

promtail:
  # Runs as a DaemonSet — one pod per node (3 total right now), tailing
  # every container's logs on that node and shipping them to Loki.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
