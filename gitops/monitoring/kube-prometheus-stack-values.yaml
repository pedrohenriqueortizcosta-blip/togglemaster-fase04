# Values for prometheus-community/kube-prometheus-stack (chart 93.3.0),
# applied via the "kube-prometheus-stack" ArgoCD Application
# (terraform/argocd-monitoring-apps.tf). Sized for a small 3x t3.medium
# coursework cluster — no persistent volumes, modest retention, resource
# requests kept deliberately small everywhere.
#
# EKS-specific tuning below (defaultRules/dashboards/kubeApiServer etc.):
# the chart's defaults assume a self-managed (kubeadm) cluster where you can
# scrape the control plane directly. On EKS, AWS runs the control plane and
# never exposes etcd/apiserver/controller-manager/scheduler to us — leaving
# those enabled just creates ~130 resources (mostly PrometheusRule objects
# for components we can't see, plus generic dashboard ConfigMaps), which
# actually broke ArgoCD's sync entirely: the Application's status object
# (listing every synced resource) exceeded etcd's ~1.5MB per-object limit
# ("etcdserver: request is too large"), so the sync could never even record
# as complete. Trimming to only what EKS can actually provide fixes both
# problems — it's the correct EKS configuration, not just a workaround.
defaultRules:
  # The generic upstream alert-rule library (35 PrometheusRule objects) —
  # we're writing our own targeted alert for the auth-service 5xx-rate
  # requirement later, so we don't need this whole bundled library.
  create: false

kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false

grafana:
  enabled: true
  # Bundled generic dashboards off — we're building our own custom
  # dashboard for this project's requirement instead.
  defaultDashboardsEnabled: false
  # No admin password set on purpose — the chart auto-generates one into a
  # Secret, same pattern already used for ArgoCD's own bootstrap admin
  # password. Retrieve it with:
  #   kubectl get secret kube-prometheus-stack-grafana -n monitoring \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  #
  # No manual Loki datasource here — loki-stack's own chart already
  # self-registers with this Grafana via a sidecar-discovered ConfigMap
  # (see loki-stack-values.yaml). Adding one here too would just duplicate
  # it in the datasource list.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      # 256Mi OOMKilled this version of Grafana (13.3.1) within ~2 minutes —
      # its search/indexing subsystem ("bleve-backend") needs more headroom
      # than older Grafana releases did. 512Mi observed stable.
      memory: 512Mi

prometheus:
  prometheusSpec:
    # Default is 10d; 24h is plenty for a coursework demo and keeps the
    # ephemeral storage footprint small (no storageSpec set below, so this
    # uses the pod's local disk rather than provisioning an EBS-backed PVC).
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # Runs as a DaemonSet — one pod per node (3 total right now).
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi
