# Values for open-telemetry/opentelemetry-collector (chart 0.178.3), applied
# via the "otel-collector" ArgoCD Application (terraform/argocd-monitoring-apps.tf).
#
# This is the mandatory central telemetry piece: the 5 microservices will
# send metrics/logs/traces here (via OTLP, once instrumented in Phase 3),
# and this Collector routes each signal to the correct backend:
#   metrics -> Prometheus (via the "prometheus" exporter, scraped below)
#   logs    -> Loki        (via the "loki" exporter)
#   traces  -> debug only for now; Datadog exporter gets added in Phase 3
#              once a real API key exists to configure it with.
#
# "contrib" image (not the default "core" one) because the "loki" exporter
# isn't in core — confirmed our deployed Loki is v2.6.1, which predates
# native OTLP log ingestion (that landed in Loki 3.0+), so we need this
# traditional exporter pushing to Loki's older /loki/api/v1/push API.

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  # Collector's own self-telemetry (how healthy/busy the Collector itself
  # is) — demonstrable today, even before Phase 3 sends any real app data.
  metrics:
    enabled: true
  # Where the "prometheus" exporter below publishes forwarded app metrics,
  # for our existing Prometheus to scrape. Not a chart-preset port name —
  # the chart's `ports` map accepts arbitrary custom keys.
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
    - port: prometheus

config:
  exporters:
    debug: {}
    prometheus:
      endpoint: "0.0.0.0:8889"
    loki:
      endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
  service:
    pipelines:
      metrics:
        exporters: [debug, prometheus]
      logs:
        exporters: [debug, loki]
      traces:
        exporters: [debug]
