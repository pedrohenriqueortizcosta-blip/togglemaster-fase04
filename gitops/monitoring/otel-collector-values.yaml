# Values for open-telemetry/opentelemetry-collector (chart 0.178.3), applied
# via the "otel-collector" ArgoCD Application (terraform/argocd-monitoring-apps.tf).
#
# This is the mandatory central telemetry piece: the 5 microservices will
# send metrics/logs/traces here (via OTLP, once instrumented in Phase 3),
# and this Collector routes each signal to the correct backend:
#   metrics -> Prometheus (via the "prometheus" exporter, scraped below)
#   logs    -> Loki        (via "otlphttp", straight to Loki's native OTLP
#              ingestion endpoint)
#   traces  -> Datadog (US1/datadoghq.com), via the "datadog" exporter. The
#              API key is NEVER stored here — it's a Kubernetes Secret
#              ("otel-collector-datadog", namespace monitoring, key
#              "api-key") created directly in the cluster, injected as the
#              DD_API_KEY env var below, and referenced in the exporter
#              config via ${env:DD_API_KEY}.
#
# "contrib" image (not the default "core" one) — the dedicated "loki"
# exporter we originally planned to use has actually been REMOVED from
# current otelcol-contrib builds (confirmed via the collector's own error:
# "'exporters' unknown type: loki"). Grafana's own ecosystem has moved to
# native OTLP ingestion instead, which is why we migrated Loki itself from
# the old loki-stack bundle (v2.6.1) to the current standalone grafana/loki
# chart (v3.6.18) — see loki-values.yaml. "contrib" is still the right
# image choice regardless, since "core" lacks several other exporters we
# may want later.

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  # Collector's own self-telemetry (how healthy/busy the Collector itself
  # is) — demonstrable today, even before Phase 3 sends any real app data.
  metrics:
    enabled: true
  # Where the "prometheus" exporter below publishes forwarded app metrics,
  # for our existing Prometheus to scrape. Not a chart-preset port name —
  # the chart's `ports` map accepts arbitrary custom keys.
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
    - port: prometheus
  # Real bug found 2026-11-17: this chart is a separate Helm release from
  # kube-prometheus-stack, so its auto-generated ServiceMonitor never had
  # the "release: kube-prometheus-stack" label that Prometheus's own
  # serviceMonitorSelector (matchLabels: release=kube-prometheus-stack)
  # requires -- meaning Prometheus had NEVER actually scraped this
  # Collector at all, since Phase 2. Every metric query against app-level
  # data (e.g. the Requirement 4 auth-service 5xx-rate alert) was silently
  # evaluating against empty data the whole time, not failing loudly.
  extraLabels:
    release: kube-prometheus-stack

# Injects the Datadog API key from a Secret created directly in the
# cluster (never committed) — see the comment above for its name/key.
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: otel-collector-datadog
        key: api-key

config:
  exporters:
    # "normal" (the default) only logs summary counts ("spans: 4") — useful
    # to confirm data is flowing at all, but not to actually see service
    # names or trace IDs. "detailed" prints the real span content, which is
    # what we actually want while verifying instrumentation during Phase 3.
    debug:
      verbosity: detailed
    prometheus:
      endpoint: "0.0.0.0:8889"
    otlphttp:
      # Loki's OTLP logs path is "/otlp/v1/logs" (not the exporter's
      # default "/v1/logs" suffix), so we use the signal-specific override
      # with the complete, exact path rather than relying on endpoint+suffix.
      logs_endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp/v1/logs"
    datadog:
      api:
        key: ${env:DD_API_KEY}
        # Account's actual data region turned out to be AP2 (Asia Pacific),
        # confirmed via the "ap2.datadoghq.com" URL Datadog's own UI
        # redirected to — not US1/datadoghq.com as originally assumed.
        # Sending to the wrong site is why traces weren't showing up even
        # though the Collector reported "successfully sent": it got a
        # response from US1's intake, just not the site this account's
        # data actually lives in.
        site: ap2.datadoghq.com
  service:
    pipelines:
      metrics:
        exporters: [debug, prometheus]
      logs:
        exporters: [debug, otlphttp]
      traces:
        exporters: [debug, datadog]
